# Concord for the trial, on one VM. See docs/runbook.md.
#   cd deploy/prod && ./gen-env.sh concord-serve.duckdns.org <email>   # once: writes .env (never committed)
#   docker compose pull && docker compose up -d --wait
#
# Images: ghcr.io/sohans1092004/concord-server and concord-backup, built and published by CI for
# every commit on main (.github/workflows/ci.yml, "publish"), pinned by CONCORD_TAG in .env to a
# full commit SHA, never "latest". The VM never builds. To build from source instead (a laptop):
#   docker compose -f compose.yaml -f compose.build.yaml build
#
# Only Caddy publishes ports (80, 443): Let's Encrypt for $CONCORD_DOMAIN, HSTS and security
# headers, and the one way in. Postgres, Redis, the Session instances and the gateway stay on
# the internal network. Two Session instances, so a board's owner can fail over (SPEC §2.4).
#
# Memory: sized for a 2 GB VM (AWS t4g.small; MemTotal 1,834 MiB, measured on the VM). Limits:
#   gateway 320 + session1 288 + session2 288 + postgres 224 + redis 40 + caddy 48 + backup 128
#   = 1,336 MiB, 72.8% of 1,834: 27% headroom even if every container sat at its limit. migrate
#   (128) runs only during a deploy. Each limit is at least 23% above its measured peak
#   (deploy/soak/results.txt, run 3: gateway 260, sessions 171/195, backup 91, caddy 29 MiB).
#   JVMs: Serial GC, capped heap, metaspace, code cache and direct memory; MALLOC_ARENA_MAX=2 keeps
#   glibc from growing native arenas per thread. The gateway gets more than its heap suggests:
#   its threads, metaspace and buffers came to 243 MiB within minutes under a 288 limit.

x-logging: &logging
  logging:
    driver: json-file
    options: { max-size: "10m", max-file: "5" }

x-server: &server
  <<: *logging
  image: ghcr.io/sohans1092004/concord-server:${CONCORD_TAG:?set CONCORD_TAG in .env to a published commit SHA}
  restart: unless-stopped

x-env: &env
  CONCORD_ENV: prod
  CONCORD_DB_URL: jdbc:postgresql://postgres:5432/concord
  CONCORD_DB_USER: concord
  CONCORD_DB_PASSWORD: ${POSTGRES_PASSWORD:?run gen-env.sh}
  CONCORD_DB_POOL: "8"
  CONCORD_REDIS_URL: redis://redis:6379
  CONCORD_INTERNAL_SECRET: ${CONCORD_INTERNAL_SECRET:?run gen-env.sh}
  MALLOC_ARENA_MAX: "2"

x-session: &session
  <<: *server
  command: ["/app/session/bin/session"]
  stop_grace_period: 20s # graceful handover: flush, snapshot, release (SPEC §2.4)
  mem_limit: 288m
  depends_on:
    migrate: { condition: service_completed_successfully }
    redis: { condition: service_healthy }
  healthcheck:
    test: ["CMD", "curl", "-fs", "http://localhost:7000/healthz"]
    interval: 10s
    retries: 30

services:
  postgres:
    <<: *logging
    image: postgres:16-alpine
    restart: unless-stopped
    mem_limit: 224m
    # Pools: gateway 8 + 2 sessions x 8 + backup 2 + migrate = 27 at most.
    command: ["postgres", "-c", "shared_buffers=48MB", "-c", "max_connections=40"]
    environment:
      POSTGRES_DB: concord
      POSTGRES_USER: concord
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?run gen-env.sh}
    volumes: [pgdata:/var/lib/postgresql/data]
    healthcheck:
      test: ["CMD", "pg_isready", "-U", "concord", "-d", "concord"]
      interval: 5s
      retries: 30

  redis:
    <<: *logging
    image: redis:7-alpine
    restart: unless-stopped
    mem_limit: 40m
    # Leases, fence counters, fan-out and presence: all rebuildable from Postgres (SPEC §5.2),
    # so no persistence. noeviction: a lease must never be evicted to make room.
    command: ["redis-server", "--save", "", "--appendonly", "no", "--maxmemory", "24mb", "--maxmemory-policy", "noeviction"]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      retries: 30

  migrate:
    <<: *server
    restart: "no"
    command: ["java", "-cp", "/app/session/lib/*", "dev.concord.common.Migrate"]
    mem_limit: 128m
    environment:
      <<: *env
      JAVA_OPTS: "-XX:+UseSerialGC -Xmx64m -XX:MaxMetaspaceSize=64m -XX:ReservedCodeCacheSize=32m"
    depends_on:
      postgres: { condition: service_healthy }

  session1:
    <<: *session
    environment:
      <<: *env
      CONCORD_INSTANCE_ID: session1
      CONCORD_ADVERTISE: ws://session1:7000/internal
      JAVA_OPTS: "-XX:+UseSerialGC -Xms32m -Xmx160m -XX:MaxMetaspaceSize=96m -XX:ReservedCodeCacheSize=48m -XX:MaxDirectMemorySize=32m"
  session2:
    <<: *session
    environment:
      <<: *env
      CONCORD_INSTANCE_ID: session2
      CONCORD_ADVERTISE: ws://session2:7000/internal
      JAVA_OPTS: "-XX:+UseSerialGC -Xms32m -Xmx160m -XX:MaxMetaspaceSize=96m -XX:ReservedCodeCacheSize=48m -XX:MaxDirectMemorySize=32m"

  gateway:
    <<: *server
    command: ["/app/gateway/bin/gateway"]
    stop_grace_period: 15s # RECONNECT_ELSEWHERE to every client, then stop (SPEC §8 row 15)
    mem_limit: 320m
    environment:
      <<: *env
      CONCORD_PORT: "8080"
      CONCORD_WEB_DIR: /app/web
      CONCORD_PUBLIC_ORIGIN: https://${CONCORD_DOMAIN:?run gen-env.sh}
      CONCORD_ALLOWED_ORIGINS: https://${CONCORD_DOMAIN}
      CONCORD_INVITE_CODE: ${CONCORD_INVITE_CODE:?run gen-env.sh}
      CONCORD_TRUSTED_PROXY: caddy
      JAVA_OPTS: "-XX:+UseSerialGC -Xms32m -Xmx128m -XX:MaxMetaspaceSize=96m -XX:ReservedCodeCacheSize=48m -XX:MaxDirectMemorySize=32m"
    depends_on:
      migrate: { condition: service_completed_successfully }
      redis: { condition: service_healthy }
    healthcheck:
      test: ["CMD", "curl", "-fs", "http://localhost:8080/healthz"]
      interval: 10s
      retries: 30

  caddy:
    <<: *logging
    image: caddy:2.8.4-alpine
    restart: unless-stopped
    mem_limit: 48m
    ports: ["80:80", "443:443"]
    environment:
      CADDY_SITE: ${CONCORD_DOMAIN} # the rehearsal sets ":80": the tunnel does the TLS
      ACME_EMAIL: ${ACME_EMAIL:?run gen-env.sh}
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      gateway: { condition: service_healthy }

  # Nightly encrypted pg_dump to off-machine storage, 14 days kept (docs/runbook.md, "Backups").
  backup:
    <<: *server
    image: ghcr.io/sohans1092004/concord-backup:${CONCORD_TAG:?set CONCORD_TAG in .env}
    command: ["/app/backup/schedule.sh"]
    mem_limit: 128m
    environment:
      <<: *env
      CONCORD_DB_POOL: "2"
      JAVA_OPTS: "-XX:+UseSerialGC -Xmx80m -XX:MaxMetaspaceSize=64m -XX:ReservedCodeCacheSize=32m"
      AGE_RECIPIENT: ${AGE_RECIPIENT:?run gen-env.sh}
      BACKUP_REMOTE: ${BACKUP_REMOTE:?run gen-env.sh}
      BACKUP_HOUR_UTC: ${BACKUP_HOUR_UTC:-3}
      BACKUP_KEEP_DAYS: "14"
      BACKUP_PING_URL: ${BACKUP_PING_URL:-}
      RCLONE_CONFIG_REMOTE_TYPE: ${RCLONE_CONFIG_REMOTE_TYPE:-}
      RCLONE_CONFIG_REMOTE_ACCOUNT: ${RCLONE_CONFIG_REMOTE_ACCOUNT:-}
      RCLONE_CONFIG_REMOTE_KEY: ${RCLONE_CONFIG_REMOTE_KEY:-}
      RCLONE_CONFIG_REMOTE_PROVIDER: ${RCLONE_CONFIG_REMOTE_PROVIDER:-}
      RCLONE_CONFIG_REMOTE_ACCESS_KEY_ID: ${RCLONE_CONFIG_REMOTE_ACCESS_KEY_ID:-}
      RCLONE_CONFIG_REMOTE_SECRET_ACCESS_KEY: ${RCLONE_CONFIG_REMOTE_SECRET_ACCESS_KEY:-}
      RCLONE_CONFIG_REMOTE_ENDPOINT: ${RCLONE_CONFIG_REMOTE_ENDPOINT:-}
      RCLONE_CONFIG_REMOTE_REGION: ${RCLONE_CONFIG_REMOTE_REGION:-}
    volumes: [backupstate:/state]
    depends_on:
      postgres: { condition: service_healthy }

volumes:
  pgdata:
  caddy_data:
  caddy_config:
  backupstate:
