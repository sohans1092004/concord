# The Phase 2 stack (SPEC §10): 2 gateways, 3 Session instances, Postgres 16, Redis 7.
#   docker compose -f deploy/docker-compose.yml up -d --build
# Dev only: CONCORD_ENV=dev, the dev internal secret, and Postgres/Redis published on localhost so
# devtools and the drills can reach them. Each Session instance reaches Redis through its own
# Toxiproxy route (redis-session1..3), so a drill can cut Redis for one instance only;
# gateways reach Redis directly.

x-server: &server
  image: concord-server
  build:
    context: ..
    dockerfile: server/Dockerfile
    target: runtime
  restart: "no"

x-env: &env
  CONCORD_ENV: dev
  CONCORD_DB_URL: jdbc:postgresql://postgres:5432/concord
  CONCORD_DB_USER: concord
  CONCORD_DB_PASSWORD: concord
  CONCORD_REDIS_URL: redis://redis:6379
  # Vite dev (5173), vite preview as Playwright runs it (4173), and the app served by a gateway.
  CONCORD_ALLOWED_ORIGINS: http://localhost:5173,http://localhost:4173,http://localhost:8081,http://localhost:8082
  # The browser tests sign up dozens of users from one IP (and Vite's proxy makes every
  # browser one IP); the default is 30 (SPEC §9.4).
  CONCORD_SIGNIN_IP_BURST: "1000"
  # Traces (SPEC 9.5): off unless set, e.g. CONCORD_OTLP_ENDPOINT=http://jaeger:4318/v1/traces
  # with --profile observability (Jaeger joins the stack).
  CONCORD_OTLP_ENDPOINT: ${CONCORD_OTLP_ENDPOINT:-}
  # Group-commit window (SPEC 6.1 step 3); production keeps the default, 5 (ADR-005). The commit-batching
  # measurement (production/load-tests) restarts the Session instances with 0, 5, 15 and 30.
  CONCORD_BATCH_MS: ${CONCORD_BATCH_MS:-5}

x-session: &session
  <<: *server
  command: ["/app/session/bin/session"]
  stop_grace_period: 20s # graceful handover: flush, snapshot, release (SPEC §2.4)
  depends_on:
    migrate: { condition: service_completed_successfully }
    redis: { condition: service_started }
    toxiproxy: { condition: service_started }

x-gateway: &gateway
  <<: *server
  command: ["/app/gateway/bin/gateway"]
  depends_on:
    redis: { condition: service_started }

services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: concord
      POSTGRES_USER: concord
      POSTGRES_PASSWORD: concord
    ports: ["5432:5432"]
    healthcheck:
      test: ["CMD", "pg_isready", "-U", "concord"]
      interval: 1s
      retries: 30

  redis:
    image: redis:7-alpine
    ports: ["6379:6379"]

  toxiproxy:
    image: ghcr.io/shopify/toxiproxy:2.9.0
    command: ["-host=0.0.0.0", "-config=/config/toxiproxy.json"]
    volumes: ["./toxiproxy.json:/config/toxiproxy.json:ro"]
    ports: ["8474:8474"] # control API, for drills

  migrate:
    <<: *server
    command: ["java", "-cp", "/app/session/lib/*", "dev.concord.common.Migrate"]
    environment: *env
    depends_on:
      postgres: { condition: service_healthy }

  session1:
    <<: *session
    environment:
      <<: *env
      CONCORD_INSTANCE_ID: session1
      CONCORD_ADVERTISE: ws://session1:7000/internal
      CONCORD_REDIS_URL: redis://toxiproxy:6381
    ports: ["7001:7000"]
  session2:
    <<: *session
    environment:
      <<: *env
      CONCORD_INSTANCE_ID: session2
      CONCORD_ADVERTISE: ws://session2:7000/internal
      CONCORD_REDIS_URL: redis://toxiproxy:6382
    ports: ["7002:7000"]
  session3:
    <<: *session
    environment:
      <<: *env
      CONCORD_INSTANCE_ID: session3
      CONCORD_ADVERTISE: ws://session3:7000/internal
      CONCORD_REDIS_URL: redis://toxiproxy:6383
    ports: ["7003:7000"]

  gateway1:
    <<: *gateway
    environment:
      <<: *env
      CONCORD_PORT: "8080"
    ports: ["8081:8080"]
  gateway2:
    <<: *gateway
    environment:
      <<: *env
      CONCORD_PORT: "8080"
    ports: ["8082:8080"]

  # ---- Observability (SPEC 9.5), opt-in: --profile observability ----------------------------
  # Prometheus http://localhost:9091 (alert rules: deploy/observability/alerts.yml), Grafana
  # http://localhost:3003 (anonymous admin, local only; the "Concord overview" dashboard is
  # provisioned), Jaeger http://localhost:16687 (traces, when CONCORD_OTLP_ENDPOINT is set above).
  prometheus:
    image: prom/prometheus:v2.53.0
    profiles: [observability]
    command: ["--config.file=/etc/prometheus/prometheus.yml"]
    volumes:
      - ./observability:/etc/prometheus:ro
    ports: ["9091:9090"]
  jaeger:
    image: jaegertracing/all-in-one:1.57.0
    profiles: [observability]
    environment:
      COLLECTOR_OTLP_ENABLED: "true"
    ports: ["16687:16686"]
  grafana:
    image: grafana/grafana:11.1.0
    profiles: [observability]
    environment:
      GF_AUTH_ANONYMOUS_ENABLED: "true"
      GF_AUTH_ANONYMOUS_ORG_ROLE: Admin
      GF_AUTH_DISABLE_LOGIN_FORM: "true"
    volumes:
      - ./observability/grafana/provisioning:/etc/grafana/provisioning:ro
      - ./observability/grafana/dashboards:/var/lib/grafana/dashboards:ro
    ports: ["3003:3000"]
    depends_on: [prometheus, jaeger]
