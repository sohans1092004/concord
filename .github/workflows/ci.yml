name: ci

# Every push: both test suites (500 fuzz seeds each), the conformance vectors, and the
# differential fuzz between the TypeScript and Java cores (SPEC §9).
on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  vectors:
    name: vectors are up to date
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python conformance/tools/build_vectors.py --check

  crdt-ts:
    name: crdt-ts (node ${{ matrix.node }})
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    strategy:
      matrix:
        node: [20, 22]
    defaults:
      run:
        working-directory: crdt-ts
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: npm
          cache-dependency-path: crdt-ts/package-lock.json
      - run: npm ci
      - run: npm run typecheck
      - name: tests with branch coverage (500 fuzz seeds)
        run: npm run coverage
        env:
          FUZZ_RUNS: "500"
      - name: coverage summary
        run: python ../.github/scripts/coverage_summary.py ts coverage/coverage-summary.json >> "$GITHUB_STEP_SUMMARY"
      - run: npm run build
      - name: publishable as a standalone package
        run: npm pack --dry-run
      - if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: ts-fuzz-failures-node${{ matrix.node }}
          path: crdt-ts/.fuzz-failures/
          if-no-files-found: ignore

  crdt-java:
    name: crdt-java
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    defaults:
      run:
        working-directory: crdt-java
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "21"
      - uses: gradle/actions/setup-gradle@v4
      - name: tests with branch coverage (500 fuzz seeds), and the CLI jar
        run: ./gradlew test jacocoTestReport jar
        env:
          FUZZ_RUNS: "500"
      - name: coverage summary
        run: python ../.github/scripts/coverage_summary.py java build/reports/jacoco/test/jacocoTestReport.xml >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@v4
        with:
          name: jacoco-report
          path: crdt-java/build/reports/jacoco/test/
      - uses: actions/upload-artifact@v4
        with:
          name: crdt-java-jar
          path: crdt-java/build/libs/crdt-java-0.1.0.jar

  differential:
    name: differential fuzz (ts vs java)
    needs: crdt-java
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "21"
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: actions/download-artifact@v4
        with:
          name: crdt-java-jar
          path: crdt-java/build/libs
      - run: npm ci
        working-directory: crdt-ts
      - run: npm ci
        working-directory: conformance/runner
      - run: npm test
        working-directory: conformance/runner
        env:
          DIFF_RUNS: "500"

  # ---- Phase 4a: the trial VM is ARM64 (Oracle Ampere), so the images and the server
  # tests run on arm64 here first, natively on GitHub's arm64 runner. ------------------------

  arm64:
    name: arm64 (server tests, production images)
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "21"
      - uses: gradle/actions/setup-gradle@v4
      - name: server tests
        working-directory: server
        run: |
          # Thread dumps of any Gradle test JVM still running after 8 minutes (the suite takes ~3):
          # the arm64 job hung twice in :gateway:test (92844f3, 790a65b) without saying where.
          ( sleep 480; for p in $(pgrep -f 'Gradle Test Executor|GradleWorkerMain'); do echo "=== thread dump of $p"; jcmd "$p" Thread.print || true; jcmd "$p" Thread.dump_to_file -format=text "/tmp/vthreads-$p.txt" >/dev/null && echo "=== with virtual threads:" && cat "/tmp/vthreads-$p.txt"; done ) &
          dog=$!
          uname -m && ./gradlew test; status=$?
          kill $dog 2>/dev/null; exit $status
      - name: the production images (runtime, with the web app; backup)
        run: |
          docker build -f server/Dockerfile --target runtime -t concord:prod .
          docker build -f server/Dockerfile --target backup -t concord-backup:prod .
          docker image inspect concord:prod -f '{{.Architecture}}' | grep -x arm64
          docker run --rm --entrypoint sh concord-backup:prod -c 'uname -m; java -version 2>&1 | head -1; pg_dump --version; age --version; rclone version | head -1; curl --version | head -1'
      - name: the image starts and refuses dev values in production
        run: |
          out=$(docker run --rm -e CONCORD_ENV=prod concord:prod /app/gateway/bin/gateway 2>&1 || true)
          echo "$out" | tail -3
          echo "$out" | grep -q "CONCORD_INTERNAL_SECRET must be at least 32 bytes, and not the dev one, outside dev"
      - if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: arm64-test-reports
          path: server/*/build/reports/tests/

  # ---- Phase 2 ------------------------------------------------------------------------------

  server:
    name: server (session, gateway; Testcontainers)
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    defaults:
      run:
        working-directory: server
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "21"
      - uses: gradle/actions/setup-gradle@v4
      - name: server tests
        run: |
          # Thread dumps of any Gradle test JVM still running after 8 minutes (the suite takes ~3):
          # the arm64 job hung twice in :gateway:test (92844f3, 790a65b) without saying where.
          ( sleep 480; for p in $(pgrep -f 'Gradle Test Executor|GradleWorkerMain'); do echo "=== thread dump of $p"; jcmd "$p" Thread.print || true; jcmd "$p" Thread.dump_to_file -format=text "/tmp/vthreads-$p.txt" >/dev/null && echo "=== with virtual threads:" && cat "/tmp/vthreads-$p.txt"; done ) &
          dog=$!
          ./gradlew test; status=$?
          kill $dog 2>/dev/null; exit $status
      - if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: server-test-reports
          path: server/*/build/reports/tests/

  client-core:
    name: client-core (unit)
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    defaults:
      run:
        working-directory: client-core
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm ci
      - run: npm run typecheck
      - run: npm test

  e2e:
    name: end to end and drills (docker compose)
    needs: [server, client-core]
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "21"
      - uses: gradle/actions/setup-gradle@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: ./gradlew -q :devtools:installDist
        working-directory: server
      - run: npm ci
        working-directory: client-core
      - name: stack up
        run: |
          docker compose -f deploy/docker-compose.yml up -d --build
          for port in 7001 7002 7003 8081 8082; do
            timeout 120 bash -c "until curl -fs localhost:$port/health >/dev/null; do sleep 1; done"
          done
      - name: convergence across gateways (1,000 ops) and §8 scenarios
        run: npx vitest run test/e2e
        working-directory: client-core
      - name: drills
        run: deploy/drills/run-all.sh
      - if: failure()
        run: docker compose -f deploy/docker-compose.yml logs --no-color > compose.log
      - if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: compose-logs
          path: compose.log

  web:
    name: web (Playwright, docker compose)
    needs: [server, client-core]
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm ci
        working-directory: client-core
      - run: npm ci
        working-directory: web
      - run: npm run typecheck
        working-directory: web
      - run: npx playwright install --with-deps chromium
        working-directory: web
      - name: stack up
        run: |
          docker compose -f deploy/docker-compose.yml up -d --build
          for port in 7001 7002 7003 8081 8082; do
            timeout 180 bash -c "until curl -fs localhost:$port/health >/dev/null; do sleep 1; done"
          done
      - name: Playwright (board UI, offline exit criterion, moved-by, tabs, 2,000-card render)
        run: npx playwright test
        working-directory: web
      - if: failure()
        run: docker compose -f deploy/docker-compose.yml logs --no-color > compose.log
      - if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: web-failure
          path: |
            compose.log
            web/test-results/

  # ---- Phase 4a: the images the trial VM pulls (it never builds) ----------------------------
  # On every push to main, after every test job passed: ghcr.io/sohans1092004/concord-server and
  # concord-backup, tagged with the full commit SHA (what .env's CONCORD_TAG pins) and "latest"
  # (for convenience only; deploys never use it). Built natively per architecture: arm64 for the
  # VM, amd64 so the same tags run on an x86 laptop for rehearsals. A fresh checkout is the build
  # context, so no .env or key can be in it; .dockerignore excludes them besides.

  publish:
    name: publish images (${{ matrix.arch }})
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: [vectors, crdt-ts, crdt-java, differential, arm64, server, client-core, e2e, web]
    strategy:
      matrix:
        include:
          - { arch: arm64, runner: ubuntu-24.04-arm }
          - { arch: amd64, runner: ubuntu-24.04 }
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 30
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
      - name: log in to ghcr.io
        run: echo "${{ secrets.GITHUB_TOKEN }}" | docker login ghcr.io -u "${{ github.actor }}" --password-stdin
      - name: build and push
        run: |
          for pair in runtime:concord-server backup:concord-backup; do
            target=${pair%%:*}; name=${pair##*:}
            ref=ghcr.io/sohans1092004/$name:$GITHUB_SHA-${{ matrix.arch }}
            docker build -f server/Dockerfile --target "$target" --build-arg VITE_BUILD="${GITHUB_SHA::12}" \
              --label org.opencontainers.image.source=https://github.com/${{ github.repository }} \
              --label org.opencontainers.image.revision=$GITHUB_SHA -t "$ref" .
            docker push "$ref"
          done

  manifest:
    name: publish images (one tag for both architectures)
    needs: publish
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
      packages: write
    steps:
      - name: log in to ghcr.io
        run: echo "${{ secrets.GITHUB_TOKEN }}" | docker login ghcr.io -u "${{ github.actor }}" --password-stdin
      - name: <sha> and latest, each for arm64 and amd64
        run: |
          for name in concord-server concord-backup; do
            base=ghcr.io/sohans1092004/$name
            docker buildx imagetools create -t "$base:$GITHUB_SHA" -t "$base:latest" "$base:$GITHUB_SHA-arm64" "$base:$GITHUB_SHA-amd64"
            docker buildx imagetools inspect "$base:$GITHUB_SHA" | grep -E "Name:|Platform:"
          done
