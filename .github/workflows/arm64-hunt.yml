name: arm64-hunt

# Temporary (Phase 4a): the server test suite on arm64, six at once, with per-test logging and a
# thread dump after 8 minutes, to catch the hang seen on 92844f3 and 790a65b. Deleted once found.
on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  gateway-tests:
    name: server tests on arm64 (${{ matrix.n }})
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        n: [1, 2, 3, 4, 5, 6]
    defaults:
      run:
        working-directory: server
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "21"
      - uses: gradle/actions/setup-gradle@v4
      - run: |
          ( sleep 480; for p in $(pgrep -f 'Gradle Test Executor|GradleWorkerMain'); do echo "=== thread dump of $p"; jcmd "$p" Thread.print || true; done ) &
          dog=$!
          ./gradlew test; status=$?
          kill $dog 2>/dev/null; exit $status
      - if: always()
        uses: actions/upload-artifact@v4
        with:
          name: gateway-reports-${{ matrix.n }}
          path: server/*/build/reports/tests/
